name: ci

# Three jobs, and only two of them need an account.
#
# lint runs on every push and pull request with no secrets and no Snowflake
# connection at all. It is the job that will actually catch things, because
# every error this project has paid for in Part 12 and Part 13 was a parse or
# naming mistake that a machine can see: a reserved word used as a column alias,
# a dollar pair inside a dollar-quoted body, an unqualified DROP after an
# application package, a double-escaped newline, a Python procedure body that
# does not compile. It also checks that scripts/rebuild.sh still accounts for
# every file in sql/, so a rename cannot silently break a rebuild.
#
# warehouse runs dbt against a zero-copy clone and needs three secrets. It is
# skipped rather than failed when they are absent, so a fork or a fresh clone
# gets the useful half without configuration.
#
#   SNOWFLAKE_ACCOUNT       AWTTGVH-OLB61128
#   SNOWFLAKE_USER          SVC_CI
#   SNOWFLAKE_PRIVATE_KEY   contents of rsa_ci.p8, whole file, BEGIN and END
#                           lines included, unencrypted
#
# THE ACCOUNT VALUE USED TO READ OOB49311 HERE, WHICH IS THE ACCOUNT LOCATOR,
# not the account identifier. dbt/profiles.yml has always connected with
# AWTTGVH-OLB61128, the organisation-account form, so setting the locator would
# have put two different spellings of the same account in one job -- dbt on one,
# the snowflake.connector steps beside it on the other. A bare locator carries no
# region, so it resolves only if the account sits in the provider's default one,
# which is not something to discover from a CI failure. Nothing had ever used the
# value, because the secret has never been set.
#
# Where each one is actually read, which is not evenly:
#
#   SNOWFLAKE_PRIVATE_KEY   both jobs. This is the credential.
#   SNOWFLAKE_USER          warehouse only, by the clone and drop steps.
#   SNOWFLAKE_ACCOUNT       warehouse, by the same two steps -- and by deploy
#                           ONLY as the presence check that arms it.
#
# dbt reads none of them: profiles.yml hardcodes the account and the user, and
# takes only the key path from the environment.
#
# deploy runs only on a push to main and builds MART for real. It is the CD half
# and it deploys EXACTLY ONE THING, which is a decision rather than an omission.
#
# SVC_CI holds QC_ENGINEER, and QC_ENGINEER owns MART and nothing else. Building
# MART on merge therefore needs no new grant: it promotes the same nine models
# and forty-two tests the warehouse job already proved against a clone, into the
# schema the same role already writes. That is the whole of what CI can deploy
# without changing who can change what.
#
# WHAT IS DELIBERATELY NOT DEPLOYED HERE:
#
#   sql/deploy/     one view, over the share entitlement. QC_ENGINEER cannot
#                   write SERVE, and granting it that would put a governance
#                   object behind a merge button. Part 13 is an entire section
#                   on protection going missing through derived objects; a row
#                   access policy that can be replaced by pressing Merge is the
#                   same failure with a nicer interface. Deploy it by hand:
#                   sql/p14_deploy.sql, which runs as ACCOUNTADMIN.
#
#   streamlit/      the PUT into @QCOMMERCE.APP.STG_APP is ACCOUNTADMIN's too,
#                   and app.py changes rarely. DEPLOY=1 scripts/p11_deploy.sh is
#                   the right amount of ceremony for a file that ships by being
#                   copied to a stage.
#
# The alternative considered and rejected: a second service user holding enough
# privilege to deploy all three. That is a CI-reachable credential able to
# rewrite governance, which is the single worst thing this account could gain,
# and it would be added to save two commands nobody runs weekly.
#
# SVC_CI is TYPE = SERVICE and key-pair only, so it cannot be used to log in
# interactively even if the secret leaks. No password exists to add here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SQL conventions
        run: ./scripts/sqllint.sh

      - name: Python inside stored procedures compiles
        run: |
          python3 - <<'PY'
          import ast, glob, sys
          bad = 0
          for path in sorted(glob.glob("sql/*.sql")):
              parts = open(path).read().split("$$")
              # A procedure body is every odd-indexed segment between $$ pairs.
              for i in range(1, len(parts), 2):
                  body = parts[i]
                  if "def " not in body:
                      continue
                  try:
                      ast.parse(body)
                  except SyntaxError as e:
                      print(f"{path}: line {e.lineno}: {e.msg}")
                      bad += 1
          print("ok" if not bad else f"{bad} procedure body/bodies failed to parse")
          sys.exit(1 if bad else 0)
          PY

      - name: Streamlit app compiles
        run: python3 -m py_compile streamlit/app.py

      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Nothing secret is committed
        run: |
          if git ls-files | grep -E '(^|/)(rsa_key|.*\.p8$|\.env$)'; then
            echo "a key or env file is tracked"; exit 1
          fi
          echo "ok"

  warehouse:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Are the secrets present
        id: gate
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -z "$ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "no SNOWFLAKE_ACCOUNT secret. Skipping the warehouse job."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt
        if: steps.gate.outputs.configured == 'true'
        run: pip install --quiet dbt-core==1.12.4 dbt-snowflake==1.12.0

      - name: Write the key
        if: steps.gate.outputs.configured == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt
          printf '%s' "$PRIVATE_KEY" > ~/svc_ci.p8
          chmod 600 ~/svc_ci.p8
          # profiles.yml defaults private_key_path to /work/rsa_ci.p8, which is
          # where the local container mounts it and is nowhere on a runner.
          echo "DBT_KEY_PATH=$HOME/svc_ci.p8" >> "$GITHUB_ENV"

      # A clone is free and instant. Building on it means a pull request never
      # touches MART, and the clone is named for the run so two pull requests
      # cannot collide.
      - name: Clone MART for this run
        if: steps.gate.outputs.configured == 'true'
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          USER_NAME: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          pip install --quiet snowflake-connector-python
          python3 - <<PY
          import os, snowflake.connector
          from cryptography.hazmat.primitives import serialization
          key = serialization.load_pem_private_key(open(os.path.expanduser("~/svc_ci.p8"), "rb").read(), password=None)
          conn = snowflake.connector.connect(
              account=os.environ["ACCOUNT"], user=os.environ["USER_NAME"],
              private_key=key.private_bytes(
                  encoding=serialization.Encoding.DER,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption()),
              role="QC_ENGINEER", warehouse="WH_TRANSFORM_XS", database="QCOMMERCE",
          )
          conn.cursor().execute("CREATE OR REPLACE SCHEMA MART_CI_${{ github.run_id }} CLONE MART")
          print("cloned")
          PY

      # dbt_packages/ is not committed; package-lock.yml is. Resolving here pins
      # the same dbt_utils the local container installs, without carrying the
      # package's files in the repository. Without this step every MART model
      # fails on the first dbt_utils.generate_surrogate_key call.
      - name: dbt deps
        if: steps.gate.outputs.configured == 'true'
        run: dbt deps --project-dir dbt

      - name: dbt build against the clone
        if: steps.gate.outputs.configured == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          DBT_TARGET_SCHEMA: MART_CI_${{ github.run_id }}
          # Set here rather than defaulted in profiles.yml, because
          # dbt_project.yml's on-run-start overrides the profile's query_tag.
          # Without it CI credits bill to Part 8 alongside the real builds.
          DBT_QUERY_TAG: p14:ci_dbt
        run: dbt build --project-dir dbt --profiles-dir dbt --target ci

      # always(), so a failed build still drops the clone. A clone costs nothing
      # until the source diverges, but it is a copy of the fact table and the
      # project spent Part 13 learning what derived copies do to protection.
      - name: Drop the clone
        if: always() && steps.gate.outputs.configured == 'true'
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          USER_NAME: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          python3 - <<PY
          import os, snowflake.connector
          from cryptography.hazmat.primitives import serialization
          key = serialization.load_pem_private_key(open(os.path.expanduser("~/svc_ci.p8"), "rb").read(), password=None)
          conn = snowflake.connector.connect(
              account=os.environ["ACCOUNT"], user=os.environ["USER_NAME"],
              private_key=key.private_bytes(
                  encoding=serialization.Encoding.DER,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption()),
              role="QC_ENGINEER", warehouse="WH_TRANSFORM_XS", database="QCOMMERCE",
          )
          conn.cursor().execute("DROP SCHEMA IF EXISTS MART_CI_${{ github.run_id }}")
          print("dropped")
          PY

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, warehouse]
    # Merges only. A pull request builds the clone above and stops there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Are the secrets present
        id: gate
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -z "$ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "no SNOWFLAKE_ACCOUNT secret. Skipping the deploy job."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt
        if: steps.gate.outputs.configured == 'true'
        run: pip install --quiet dbt-core==1.12.4 dbt-snowflake==1.12.0

      - name: Write the key
        if: steps.gate.outputs.configured == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt
          printf '%s' "$PRIVATE_KEY" > ~/svc_ci.p8
          chmod 600 ~/svc_ci.p8
          echo "DBT_KEY_PATH=$HOME/svc_ci.p8" >> "$GITHUB_ENV"

      - name: dbt deps
        if: steps.gate.outputs.configured == 'true'
        run: dbt deps --project-dir dbt

      # --target dev, and DBT_TARGET_SCHEMA left unset so dbt_project.yml's
      # default of MART applies. macros/generate_schema_name.sql is what makes
      # that MART literally rather than RAW_MART.
      #
      # A separate query tag from the clone build. p14:ci_dbt is a pull request
      # rehearsing against a copy; p14:cd_dbt is a merge changing the real mart,
      # and sql/p15_cost.sql splits on the prefix, so one tag for both would
      # make them impossible to tell apart afterwards.
      - name: dbt build into MART
        if: steps.gate.outputs.configured == 'true'
        env:
          DBT_QUERY_TAG: p14:cd_dbt
        run: dbt build --project-dir dbt --profiles-dir dbt --target dev
