name: qcommerce
version: 1.0.0
config-version: 2

profile: qcommerce

seed-paths: ["seeds"]
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Mechanism 14 is seeds only. Models arrive with CORE and MART in Part 6, and
# this file is deliberately theirs to grow into rather than a throwaway.
seeds:
  qcommerce:
    +schema: null          # land in the target schema (RAW), not RAW_<suffix>
    +quote_columns: false  # unquoted -> upper case -> joinable. Same trap as write_pandas.
    +full_refresh: true    # business constants have one current version
    +tags: ["seed", "mechanism_14"]

models:
  qcommerce:
    mart:
      # MART literally, not RAW_MART. macros/generate_schema_name.sql overrides
      # dbt's default concatenation -- that default exists so developers sharing
      # a warehouse do not collide, which is not the situation here. The layer
      # names are the architecture.
      # Env-driven so CI lands in the run's clone. DBT_TARGET_SCHEMA has been
      # set by the workflow since Part 14 and read by nothing, which meant a
      # pull request would have built into MART itself -- the opposite of what
      # cloning it was for.
      +schema: "{{ env_var('DBT_TARGET_SCHEMA', 'MART') }}"
      +materialized: table
      +tags: ["mart"]

# This runs after the connection is made and overrides profiles.yml's
# query_tag, so the two have to agree or the profile's value never takes effect.
on-run-start:
  - "ALTER SESSION SET QUERY_TAG = '{{ env_var('DBT_QUERY_TAG', 'p08:dbt') }}'"
