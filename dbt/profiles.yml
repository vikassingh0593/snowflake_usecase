# Committed on purpose. There is no secret in this file -- only an account,
# a user, a role and the PATH to a key. The key itself is gitignored (*.p8).
#
# SVC_CI, not SVC_KAFKA: dbt is QC_ENGINEER's work, and QC_LOADER cannot create
# in CORE or MART where the models will go in Part 6. Splitting the two service
# users is the whole reason for having two.
qcommerce:
  target: dev
  outputs:
    dev: &snowflake
      type: snowflake
      account: AWTTGVH-OLB61128
      user: SVC_CI
      role: QC_ENGINEER
      private_key_path: "{{ env_var('DBT_KEY_PATH', '/work/rsa_ci.p8') }}"
      database: QCOMMERCE
      warehouse: WH_TRANSFORM_XS
      schema: RAW
      threads: 4
      client_session_keep_alive: false
      # Every session tagged, same as every other part. This is what makes
      # WAREHOUSE_METERING_HISTORY attributable per mechanism instead of a
      # single undifferentiated number.
      # Was hardcoded to p06:dbt_seeds, which was true when mechanism 14 was
      # seeds and nothing else. sql/p15_cost.sql attributes credits with
      # SPLIT_PART(QUERY_TAG, ':', 1), so every MART build since Part 8 has
      # billed to Part 6 under a tag that says "seeds".
      query_tag: "{{ env_var('DBT_QUERY_TAG', 'p08:dbt') }}"
      retry_on_database_errors: true
      connect_retries: 2

    # The target .github/workflows/ci.yml has been passing --target ci to since
    # Part 14. It did not exist, so the job would have failed at connection with
    # "profile 'qcommerce' does not have a target named 'ci'" the first time the
    # secrets were set. It has been skipping for want of SNOWFLAKE_ACCOUNT.
    #
    # Identical connection, two differences: it builds into the run's clone
    # rather than MART, and its credits are attributable separately.
    # No query_tag override here. dbt_project.yml's on-run-start runs after the
    # connection and wins, so a second default would read as configuration and
    # never take effect. The workflow sets DBT_QUERY_TAG instead.
    ci:
      <<: *snowflake
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'MART') }}"
